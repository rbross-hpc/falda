name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: build + test (Node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '22', '24', '26']
    steps:
      - uses: actions/checkout@v4

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Test suite
        run: npm test

  analysis:
    name: optional analysis package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install analysis dependencies
        run: uv sync --project analysis --locked --all-groups
      - name: Check analysis formatting
        run: uv run --project analysis ruff format --check analysis
      - name: Lint analysis package
        run: uv run --project analysis ruff check analysis
      - name: Type-check analysis package
        run: uv run --project analysis mypy analysis/src analysis/tests
      - name: Test analysis package
        run: uv run --project analysis pytest

  origin-clean:
    name: origin-clean guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no origin-stack vocabulary in tracked files
        run: |
          # FALDA is born-clean US-origin. Block any reintroduction of
          # origin-stack vocabulary in tracked source/docs/prose.
          if git grep -inE 'tencent|tdai|alibaba|repatriat|tcvdb|jieba|memory-tencentdb' -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::origin-stack vocabulary found in tracked files — FALDA must stay origin-clean."
            exit 1
          fi
          echo "origin-clean: OK (no forbidden strings)"
